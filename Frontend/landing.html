<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zavrl Tennis Team - Dobrodošli</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(135deg, #0e3a20, #1a5632); color: white; min-height: 100vh; display: flex; flex-direction: column; }
        .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
        .hero h1 { font-size: 3rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 1rem; }
        .hero p { font-size: 1.2rem; opacity: 0.9; max-width: 600px; margin-bottom: 2rem; }
        .btn-group { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 0.8rem 2rem; border-radius: 50px; border: none; font-weight: 600; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .btn-primary { background: #fdd835; color: #0e3a20; }
        .btn-outline { background: transparent; border: 2px solid white; color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="hero">
        <h1>🎾 Zavrl Tennis Team</h1>
        <p>Teniški klub Ptuj – rezervirajte igrišče hitro in enostavno. Pridružite se naši skupnosti.</p>
        <div class="btn-group">
            <a href="/app" class="btn btn-primary">Vstopi v rezervacije</a>
            <button class="btn btn-outline" onclick="showLogin()">Prijava</button>
            <button class="btn btn-outline" onclick="showRegister()">Registracija</button>
        </div>
    </div>
    <!-- Tukaj lahko vključite modal za prijavo/registracijo, podobno kot v index.html -->
    <script>
        // Poenostavljena logika za prijavo in registracijo
        const API_URL = ''; // ker strežnik servira to stran, lahko pustite prazno
        function showLogin() {
            // Odpre modal za prijavo (lahko uporabite enak obrazec kot v index.html)
            alert('Prijava bo kmalu na voljo. Za zdaj pojdite na /app');
        }
        function showRegister() {
            alert('Registracija bo kmalu na voljo. Za zdaj pojdite na /app');
        }
    </script>
</body>
</html>
