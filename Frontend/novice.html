<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zavrl Tennis Team - Novice</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎾</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary:#1a5632; --primary-dark:#0e3a20; --accent:#fdd835; --bg:#f0f4f0; --text:#1a1a1a; --text-light:#555; --white:#fff; --shadow:0 4px 24px rgba(0,0,0,0.08); --shadow-lg:0 8px 40px rgba(0,0,0,0.12); --radius:16px; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
        .header { position:fixed; top:0; left:0; right:0; z-index:1000; background:rgba(255,255,255,0.95); backdrop-filter:blur(10px); box-shadow:0 2px 20px rgba(0,0,0,0.08); padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center; }
        .logo { display:flex; align-items:center; gap:0.8rem; text-decoration:none; color:var(--primary-dark); font-weight:800; font-size:1.3rem; }
        .logo-icon { width:48px; height:48px; background:var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.4rem; font-weight:900; color:var(--primary-dark); }
        .nav-links { display:flex; gap:1.5rem; align-items:center; }
        .nav-links a { text-decoration:none; color:var(--text); font-weight:600; font-size:0.95rem; transition:color 0.3s; }
        .nav-links a:hover { color:var(--primary); }
        .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent-dark)); color:var(--primary-dark); padding:0.7rem 1.8rem; border-radius:50px; font-weight:700; text-decoration:none; }
        .menu-toggle { display:none; background:none; border:none; font-size:1.8rem; cursor:pointer; color:var(--primary-dark); }
        .main { max-width:1200px; margin:0 auto; padding:8rem 2rem 4rem; }
        .section-title { text-align:center; margin-bottom:3rem; }
        .section-title h2 { font-size:2.5rem; font-weight:800; color:var(--primary-dark); }
        .news-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:2rem; }
        .news-card { background:var(--white); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); transition:0.3s; }
        .news-card:hover { transform:translateY(-5px); box-shadow:var(--shadow-lg); }
        .news-img { width:100%; height:200px; object-fit:cover; background:var(--primary); display:flex; align-items:center; justify-content:center; color:white; font-size:3rem; }
        .news-content { padding:1.5rem; }
        .news-content h4 { font-size:1.2rem; font-weight:700; color:var(--primary-dark); margin-bottom:0.5rem; }
        .news-content p { color:var(--text-light); font-size:0.95rem; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
        .news-card.expanded .news-content p { -webkit-line-clamp:unset; }
        .read-more-btn { background:none; border:none; color:var(--primary); font-weight:700; font-size:0.9rem; cursor:pointer; padding:0; margin-top:0.5rem; }
        .news-date { font-size:0.8rem; color:var(--text-light); margin-top:1rem; display:block; }
        .pagination { display:flex; gap:0.5rem; margin-top:2rem; justify-content:center; flex-wrap:wrap; }
        .page-btn { padding:0.5rem 0.9rem; border:1px solid #e0e0e0; background:white; cursor:pointer; border-radius:6px; font-size:0.95rem; font-family:'Inter',sans-serif; transition:0.3s; }
        .page-btn:hover { background:#e8f5e9; }
        .page-btn.active { background:var(--primary); color:white; border-color:var(--primary); }
        .news-empty { text-align:center; color:var(--text-light); font-style:italic; padding:2rem; }
        
        /* Modal za prikaz novice */
        .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); z-index:2000; display:none; align-items:center; justify-content:center; padding:1rem; }
        .modal-overlay.open { display:flex; }
        .modal { background:white; border-radius:var(--radius); max-width:800px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-lg); padding:0; position:relative; }
        .modal-close { position:absolute; top:1rem; right:1rem; width:40px; height:40px; border-radius:50%; border:none; background:rgba(0,0,0,0.5); color:white; font-size:1.5rem; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:10; }
        .modal-img { width:100%; max-height:400px; object-fit:cover; border-radius:var(--radius) var(--radius) 0 0; }
        .modal-content { padding:2rem; }
        .modal-content h2 { color:var(--primary-dark); margin-bottom:1rem; }
        .modal-content p { color:var(--text-light); margin-bottom:1.5rem; white-space:pre-wrap; }
        .modal-gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:1rem; }
        .modal-gallery img { width:100%; height:150px; object-fit:cover; border-radius:8px; }
        .modal-date { font-size:0.85rem; color:var(--text-light); margin-top:1rem; display:block; }
        
        .footer { background:var(--primary-dark); color:white; padding:2rem; text-align:center; }
        
        @media (max-width:768px) {
            .header { padding:0.8rem 1rem; }
            .logo { font-size:1.1rem; }
            .logo-icon { width:40px; height:40px; font-size:1.1rem; }
            .menu-toggle { display:block; }
            .nav-links { display:none; position:absolute; top:100%; left:0; right:0; background:white; flex-direction:column; padding:1rem; box-shadow:0 4px 10px rgba(0,0,0,0.1); gap:1rem; align-items:flex-start; }
            .nav-links.open { display:flex; }
            .nav-links a { width:100%; padding:0.5rem 0; border-bottom:1px solid #eee; }
            .main { padding:7rem 1rem 2rem; }
            .news-grid { grid-template-columns:1fr; gap:1rem; }
            .modal { max-width:100%; }
            .modal-content { padding:1.2rem; }
            .modal-gallery { grid-template-columns:1fr 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo"><div class="logo-icon">ZT</div><span>Zavrl Tennis Team</span></a>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <nav class="nav-links" id="navLinks">
            <a href="/o-klubu">O klubu</a>
            <a href="/rekreacija">Rekreacija</a>
            <a href="/cenik">Cenik</a>
            <a href="/novice">Novice</a>
            <a href="/kontakt">Kontakt</a>
            <a href="/app" class="btn-primary">Rezerviraj</a>
        </nav>
    </header>
    <main class="main">
        <div class="section-title"><h2>Novice</h2></div>
        <div class="news-grid" id="newsGrid"></div>
        <div class="pagination" id="newsPagination"></div>
    </main>
    
    <!-- Modal za prikaz novice -->
    <div class="modal-overlay" id="newsModal">
        <div class="modal">
            <button class="modal-close" onclick="closeNewsModal()">✕</button>
            <div id="newsModalContent"></div>
        </div>
    </div>
    
    <footer class="footer"><p>&copy; 2026 Zavrl Tennis Team</p></footer>
    
    <script>
        let allNews = [];
        let currentNewsPage = 1;
        const NEWS_PER_PAGE = 6;

        async function loadNovice() {
            try {
                const res = await fetch('/api/novice');
                const data = await res.json();
                if (data.novice && data.novice.length > 0) {
                    allNews = data.novice;
                    renderNovice();
                } else {
                    document.getElementById('newsGrid').innerHTML = '<div class="news-empty">Novic še ni.</div>';
                }
            } catch (e) {
                document.getElementById('newsGrid').innerHTML = '<div class="news-empty">Napaka pri nalaganju novic.</div>';
            }
        }

        function renderNovice() {
            const grid = document.getElementById('newsGrid');
            const pagination = document.getElementById('newsPagination');
            
            const totalPages = Math.ceil(allNews.length / NEWS_PER_PAGE);
            const currentPage = Math.min(currentNewsPage, totalPages) || 1;
            currentNewsPage = currentPage;

            const start = (currentPage - 1) * NEWS_PER_PAGE;
            const newsToShow = allNews.slice(start, start + NEWS_PER_PAGE);

            if (newsToShow.length === 0) {
                grid.innerHTML = '<div class="news-empty">Novic še ni.</div>';
                pagination.innerHTML = '';
                return;
            }

            grid.innerHTML = newsToShow.map(n => `
                <div class="news-card">
                    ${n.slika_url ? `<img class="news-img" src="${n.slika_url}" alt="${n.naslov}" onerror="this.style.display='none'">` : '<div class="news-img">🎾</div>'}
                    <div class="news-content">
                        <h4>${n.naslov}</h4>
                        <p>${n.vsebina}</p>
                        <button class="read-more-btn" onclick="openNewsModal(${n.id})">Preberi več</button>
                        <span class="news-date">${new Date(n.datum).toLocaleDateString('sl-SI')}</span>
                    </div>
                </div>
            `).join('');

            if (totalPages > 1) {
                let paginationHtml = '';
                for (let i = 1; i <= totalPages; i++) {
                    paginationHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changeNewsPage(${i})">${i}</button>`;
                }
                pagination.innerHTML = paginationHtml;
            } else {
                pagination.innerHTML = '';
            }
        }

        function changeNewsPage(page) {
            currentNewsPage = page;
            renderNovice();
        }

        function openNewsModal(id) {
            const novica = allNews.find(n => n.id === id);
            if (!novica) return;
            
            const slike = [];
            if (novica.slike) {
                try { slike.push(...JSON.parse(novica.slike)); } catch(e) {}
            }
            
            const modal = document.getElementById('newsModal');
            const content = document.getElementById('newsModalContent');
            
            content.innerHTML = `
                ${novica.slika_url ? `<img class="modal-img" src="${novica.slika_url}" alt="${novica.naslov}" onerror="this.style.display='none'">` : ''}
                <div class="modal-content">
                    <h2>${novica.naslov}</h2>
                    <p>${novica.vsebina}</p>
                    ${slike.length > 0 ? `<div class="modal-gallery">${slike.map(s => `<img src="${s}" alt="Slika">`).join('')}</div>` : ''}
                    <span class="modal-date">${new Date(novica.datum).toLocaleDateString('sl-SI')}</span>
                </div>
            `;
            
            modal.classList.add('open');
        }

        function closeNewsModal() {
            document.getElementById('newsModal').classList.remove('open');
        }

        // Zapri modal ob kliku na ozadje
        document.getElementById('newsModal').addEventListener('click', function(e) {
            if (e.target === this) closeNewsModal();
        });

        function toggleMenu() {
            const nav = document.getElementById('navLinks');
            nav.classList.toggle('open');
        }

        loadNovice();
    </script>
</body>
</html>
